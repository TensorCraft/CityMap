<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drive One Car v4 — Vanilla JS</title>
  <style>
    /* 与原版保持一致的样式（不可改变UI） */
    .root { width: 100%; height: 100%; display: flex; flex-direction: column; background: #1b1d1f; color: #e5e5e5; }
    .toolbar { padding: 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #262626; }
    .actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .btn { padding: 6px 8px; font-size: 12px; background: #3a3a3a; color: #e5e5e5; border: none; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #4a4a4a; }
    .zoomLabel { opacity: 0.7; font-size: 12px; }
    .canvasWrap { position: relative; flex: 1; }
    .overlay { position: absolute; left: 12px; bottom: 12px; background: rgba(0,0,0,.5); backdrop-filter: blur(6px); padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 20px; }
    html, body { height: 100%; margin: 0; }
  </style>
</head>
<body>
  <div class="root">
    <div class="toolbar">
      <input id="fileInput" type="file" accept=".svg" />
      <div class="actions">
        <button id="btnBuildings" class="btn">Buildings (B)</button>
        <button id="btnFollow" class="btn">Camera Follow (V)</button>
        <button id="btnDebug" class="btn">Collision Debug (C)</button>
        <span class="zoomLabel">Zoom: <span id="zoomLabel">1.00</span></span>
      </div>
    </div>

    <div class="canvasWrap">
      <canvas id="canvas" style="width: 100%; height: calc(100vh - 56px); display: block;"></canvas>

      <div class="overlay">
        <div style="font-weight: 600;">Operations:</div>
        <div>Mouse scroll: Zoom, Drag</div>
        <div>B Show/Hide Buildings，V Camera Follow</div>
        <div>C Collision Debug</div>
        <div>Load your city map svg file to start</div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
